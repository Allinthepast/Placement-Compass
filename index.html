[0]),6))).map(r=>`<span class="pill Research">${fmt(r.date,{weekday:'short',day:'numeric',month:'short'})}</span>`).join(' ')}</div>`:''}</div>`).join('')}</div></div><div class="card"><h2>Plan rules</h2><div class="summary"><div class="summary-row"><span>Placement target</span><strong>130 days</strong></div><div class="summary-row"><span>Study</span><strong>≥ 1 day / ordinary week</strong></div><div class="summary-row"><span>Research allowance</span><strong>up to 30 days</strong></div><div class="summary-row"><span>Placement start</span><strong>4 Sep 2026</strong></div></div><div class="info">Actual research is logged by hour so prep, liaison and delivery can be recorded honestly rather than pretending every session is a full day.</div></div></div>`}function calendarRender(){let y=cursor.getFullYear(),m=cursor.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-(first.getDay()+6)%7),cells=[];for(let i=0;i<42;i++){let x=add(start,i),k=iso(x),r=state.days[k],rs=rsession(k),weekend=x.getDay()==0||x.getDay()==6,status=r?.plan||'',note=r?.activity||r?.specialNote||rs?.label||'';cells.push(`<div class="day ${status.replaceAll(' ','')} ${weekend?'weekend':''}" ${r?`data-date="${k}"`:''}><div class="day-num">${x.getDate()}</div>${rs?'<span class="dot"></span>':''}${r?`<div style="margin-top:7px"><span class="pill ${status.replaceAll(' ','')}">${status}</span></div>`:''}<div class="day-note">${esc(note)}</div></div>`)}calendar.innerHTML=`<div class="calendar-toolbar"><div><h2>${first.toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</h2><div class="muted small">Tap a weekday to edit it.</div></div><div class="actions"><button class="btn ghost" id="prev">←</button><button class="btn ghost" id="calToday">Today</button><button class="btn ghost" id="next">→</button></div></div><div class="month-grid">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="weekday">${x}</div>`).join('')}${cells.join('')}</div>`;prev.onclick=()=>{cursor=new Date(y,m-1,1);calendarRender();bindDates()};next.onclick=()=>{cursor=new Date(y,m+1,1);calendarRender();bindDates()};calToday.onclick=()=>{cursor=new Date();calendarRender();bindDates()};bindDates()}function planRender(){let g={};Object.values(state.days).forEach(r=>(g[iso(mon(d(r.date)))]??=[]).push(r));plan.innerHTML=`<div class="section-head"><div><h2>130-day plan</h2><div class="muted">The plan is editable; the one-study-day floor is preserved when rebuilt.</div></div><button class="btn ghost" id="rebuild">Rebuild smart plan</button></div><div class="week-list">${Object.keys(g).sort().map(w=>{let rows=g[w].sort((a,b)=>a.date.localeCompare(b.date)),n=rows.filter(r=>r.plan==='Placement').length;return`<div class="week-row"><div><strong>w/c ${fmt(w)}</strong><div class="muted small">${rows.some(r=>r.plan==='University')?'University week/day':''}</div></div><div class="week-days">${rows.map(r=>`<div class="week-day ${r.plan.replaceAll(' ','')}" data-date="${r.date}"><b>${fmt(r.date,{weekday:'short'})}</b>${d(r.date).getDate()}</div>`).join('')}</div><div><strong>${n}</strong> placement</div></div>`}).join('')}</div>`;rebuild.onclick=()=>{autoplan(state.days,state.settings);persist();toast('Plan rebuilt')};bindDates()}function logRows(rows){return rows.map(r=>`<tr class="click-row" data-date="${r.date}"><td>${fmt(r.date,{weekday:'short',day:'numeric',month:'short',year:'numeric'})}</td><td><span class="pill ${r.plan.replaceAll(' ','')}">${r.plan}</span></td><td>${esc(r.activity||'')}</td><td>${esc(r.category||'')}</td><td class="num">${r.placementCredit||0}</td><td class="num">${Number(r.researchHours||0).toFixed(2)}</td></tr>`).join('')}function logRender(){let rows=Object.values(state.days).sort((a,b)=>a.date.localeCompare(b.date));log.innerHTML=`<div class="section-head"><div><h2>Activity log</h2><div class="muted">One line per day is enough.</div></div><button class="btn primary" id="addLog">+ Log activity</button></div><div class="controls"><input class="search" id="search" placeholder="Search activity…"><select class="search" id="filter"><option value="">All day types</option>${['Placement','Study','University','Holiday','Bank Holiday'].map(x=>`<option>${x}</option>`).join('')}</select><button class="btn ghost" id="csv">Export CSV</button></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Plan</th><th>Activity</th><th>Category</th><th>Day credit</th><th>Research h</th></tr></thead><tbody id="tbody">${logRows(rows)}</tbody></table></div><div class="card" style="margin-top:16px"><h2>Termly supervisor review</h2><div class="review">${['autumn','spring','summer'].map(term=>{let r=state.settings.reviews[term];return`<div class="review-box"><strong>${term[0].toUpperCase()+term.slice(1)}</strong><label class="small"><input type="checkbox" data-rcheck="${term}" ${r.reviewed?'checked':''}> Reviewed</label><input data-rsup="${term}" placeholder="Supervisor" value="${esc(r.supervisor)}"><input data-rdate="${term}" type="date" value="${r.date}"><textarea data-rnote="${term}" placeholder="Review note">${esc(r.note)}</textarea></div>`}).join('')}</div></div>`;addLog.onclick=()=>openModal(nearest());csv.onclick=exportCsv;search.oninput=filterLog;filter.onchange=filterLog;bindDates();document.querySelectorAll('[data-rcheck]').forEach(e=>e.onchange=()=>{state.settings.reviews[e.dataset.rcheck].reviewed=e.checked;persist(false)});document.querySelectorAll('[data-rsup]').forEach(e=>e.onchange=()=>{state.settings.reviews[e.dataset.rsup].supervisor=e.value;persist(false)});document.querySelectorAll('[data-rdate]').forEach(e=>e.onchange=()=>{state.settings.reviews[e.dataset.rdate].date=e.value;persist(false)});document.querySelectorAll('[data-rnote]').forEach(e=>e.onchange=()=>{state.settings.reviews[e.dataset.rnote].note=e.value;persist(false)})}function filterLog(){let q=search.value.toLowerCase(),f=filter.value,rows=Object.values(state.days).filter(r=>(!f||r.plan===f)&&(!q||JSON.stringify(r).toLowerCase().includes(q))).sort((a,b)=>a.date.localeCompare(b.date));tbody.innerHTML=logRows(rows);bindDates()}function researchRender(){let t=totals(),custom=[...state.customResearch].sort((a,b)=>a.date.localeCompare(b.date));research.innerHTML=`<div class="section-head"><div><h2>Research hours</h2><div class="muted">Log qualifying placement-provider research by actual time.</div></div></div><div class="grid three"><div class="card kpi"><div class="label">Actual research</div><div class="big">${t.rh.toFixed(1)}<small> h</small></div></div><div class="card kpi"><div class="label">Day equivalent</div><div class="big">${t.rd.toFixed(2)}<small> d</small></div></div><div class="card kpi"><div class="label">Remaining allowance</div><div class="big">${Math.max(0,state.settings.researchMaxDays-t.rd).toFixed(2)}<small> d</small></div></div></div><div class="grid two" style="margin-top:16px"><div class="card"><h2>Add research time</h2><div class="form-grid"><div class="field"><label>Date</label><input id="rdate" type="date"></div><div class="field"><label>Hours</label><input id="rhours" type="number" min="0" step=".25"></div><div class="field"><label>Type</label><select id="rtype"><option>Preparation</option><option>Liaison</option><option>Delivery</option><option>Data collection</option><option>Evaluation</option><option>Dissemination</option><option>Other qualifying research</option></select></div><div class="field full"><label>Note</label><input id="rnote" placeholder="e.g. adapted encounter and prepared materials"></div></div><div class="modal-actions"><button class="btn primary" id="addResearch">Add research time</button></div><div class="info">Thesis analysis and degree write-up belong in study time; school/service-facing research can count where it meets the placement-provider criteria.</div></div><div class="card"><h2>Extra research entries</h2>${custom.length?`<div class="summary">${custom.map((r,i)=>`<div class="summary-row"><span>${fmt(r.date)} · ${esc(r.type)}<br><small class="muted">${esc(r.note||'')}</small></span><span><strong>${Number(r.hours).toFixed(2)}h</strong> <button class="btn soft" data-del="${i}">×</button></span></div>`).join('')}</div>`:'<div class="muted">None yet.</div>'}</div></div>`;addResearch.onclick=()=>{let date=rdate.value,h=Number(rhours.value),type=rtype.value,note=rnote.value.trim();if(!date||h<=0)return toast('Add a date and hours');state.customResearch.push({date,hours:h,type,note});persist();toast('Research time added')};document.querySelectorAll('[data-del]').forEach(e=>e.onclick=()=>{state.customResearch.splice(Number(e.dataset.del),1);persist()})}function schoolsRender(){let today=iso(new Date());schools.innerHTML=`<div class="section-head"><div><h2>Tracked schools</h2><div class="muted">Useful for deciding when pupil-facing work is actually possible.</div></div></div><div class="grid three">${S.map(s=>`<div class="card school-card"><span class="pill school-status ${open(s,today)?'open':'closed'}">${open(s,today)?'Open on this date':'Closed on this date'}</span><h2>${s.name}</h2><div class="muted small">${s.phase}</div><ul>${s.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul><a href="${s.url}" target="_blank" rel="noopener">Published term dates ↗</a></div>`).join('')}</div>`}function settingsRender(){let t=totals();settings.innerHTML=`<div class="section-head"><div><h2>Settings & backup</h2><div class="muted">The boring bits that prevent a data-loss horror story.</div></div></div><div class="grid two"><div class="card"><h2>Targets</h2><div class="form-grid"><div class="field"><label>Placement target</label><input id="target" type="number" value="${state.settings.targetDays}"></div><div class="field"><label>Research max days</label><input id="rmax" type="number" value="${state.settings.researchMaxDays}"></div><div class="field"><label>Hours per placement day</label><input id="hpd" type="number" step=".25" value="${state.settings.hoursPerDay}"></div><div class="field"><label>Currently planned</label><input disabled value="${t.planned}"></div><div class="field full"><label>Plan label</label><input id="pname" value="${esc(state.settings.planName)}"></div></div><div class="modal-actions"><button class="btn primary" id="saveSettings">Save settings</button></div></div><div class="card"><h2>Backup & portability</h2><p class="muted">Data stays in this browser/device. Export a backup before changing device or clearing browser data.</p><div class="summary"><div class="summary-row"><span>Storage</span><strong>Browser local storage</strong></div><div class="summary-row"><span>Cloud sync</span><strong>Not yet</strong></div><div class="summary-row"><span>App version</span><strong>${VERSION}</strong></div></div><div class="modal-actions" style="justify-content:flex-start"><button class="btn primary" id="backup">Export JSON backup</button><label class="btn ghost" style="cursor:pointer">Restore backup<input id="restore" type="file" accept="application/json" hidden></label></div></div></div><div class="card" style="margin-top:16px"><h2>Plan maintenance</h2><div class="actions"><button class="btn ghost" id="rebuild2">Rebuild smart plan</button><button class="btn danger" id="reset">Reset entire app</button></div></div>`;saveSettings.onclick=()=>{state.settings.targetDays=Math.max(1,Number(target.value)||130);state.settings.researchMaxDays=Math.max(0,Number(rmax.value)||30);state.settings.hoursPerDay=Math.max(.25,Number(hpd.value)||7.5);state.settings.planName=pname.value.trim()||DEF.planName;persist();toast('Settings saved')};backup.onclick=()=>download(JSON.stringify(state,null,2),'Placement-Compass-backup.json','application/json');restore.onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!x.days||!x.settings)throw 0;state=x;persist();toast('Backup restored')}catch{toast('Could not read backup')}};rebuild2.onclick=()=>{autoplan(state.days,state.settings);persist();toast('Plan rebuilt')};reset.onclick=()=>{if(confirm('Reset the entire app on this device?')){state=defaults();persist();toast('App reset')}}}function openModal(k){let r=state.days[k];if(!r)return;let rs=rsession(k),opens=S.filter(s=>open(s,k));modalEye.textContent=`${r.plan||'Unplanned'} · ${opens.length} tracked schools open`;modalTitle.textContent=long(k);modalBody.innerHTML=`<div class="form-grid"><div class="field"><label>Planned day type</label><select id="mplan">${['Placement','Study','University','Holiday','Bank Holiday'].map(x=>`<option ${r.plan===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Activity category</label><select id="mcat"><option value="">— Select —</option>${['Casework','Consultation','Assessment','Intervention','Report writing','Supervision','Training / CPD','Service development','Research','Administration','University','Study'].map(x=>`<option ${r.category===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field full"><label>Activity log — one line is enough</label><textarea id="mactivity" placeholder="e.g. EHCNA visit, write-up and supervision">${esc(r.activity)}</textarea></div><div class="field"><label>Placement day credit</label><select id="mcredit"><option value="0" ${!r.placementCredit?'selected':''}>0 — not counted</option><option value="1" ${Number(r.placementCredit)===1?'selected':''}>1 — placement day</option></select></div><div class="field"><label>Qualifying research hours</label><input id="mrh" type="number" min="0" step=".25" value="${Number(r.researchHours||0)}"></div><div class="field full"><label>Research note</label><input id="mrnote" value="${esc(r.researchNote)}" placeholder="e.g. session prep, delivery, liaison"></div></div>${r.specialNote?`<div class="info"><b>Calendar note:</b> ${esc(r.specialNote)}</div>`:''}${rs?`<div class="info"><b>Planned Bemrose research:</b> ${rs.label} · 1h <button class="btn soft" id="use1">Set to 1h</button></div>`:''}<div class="info"><b>Tracked schools open:</b> ${opens.length?opens.map(s=>s.name).join(', '):'None'}</div><div class="modal-actions"><button class="btn ghost" id="saveNo">Save</button><button class="btn primary" id="saveDay">${r.plan==='Placement'?'Save + count placement day':'Save day'}</button></div>`;backdrop.classList.remove('hidden');if(rs)use1.onclick=()=>mrh.value=1;saveNo.onclick=()=>saveModal(k,false);saveDay.onclick=()=>saveModal(k,r.plan==='Placement')}function saveModal(k,mark){let r=state.days[k];r.plan=mplan.value;r.category=mcat.value;r.activity=mactivity.value.trim();r.placementCredit=mark&&r.plan==='Placement'?1:Number(mcredit.value||0);r.researchHours=Number(mrh.value||0);r.researchNote=mrnote.value.trim();r.completed=!!r.placementCredit;r.updatedAt=new Date().toISOString();backdrop.classList.add('hidden');persist();toast('Day saved')}function nearest(){let x=new Date();if(x.getDay()==6)x=add(x,-1);if(x.getDay()==0)x=add(x,1);let k=iso(x);return state.days[k]?k:Object.keys(state.days)[0]}function exportCsv(){let head=['Date','Planned day type','Activity','Category','Placement day credit','Research hours','Research note'],rows=[head,...Object.values(state.days).sort((a,b)=>a.date.localeCompare(b.date)).map(r=>[r.date,r.plan,r.activity,r.category,r.placementCredit||0,r.researchHours||0,r.researchNote])],csv=rows.map(r=>r.map(v=>`"${String(v??'').replaceAll('"','""')}"`).join(',')).join('\r\n');download(csv,'Placement-Compass-Activity-Log.csv','text/csv;charset=utf-8')}function download(c,n,t){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:t}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}function bindDates(){document.querySelectorAll('[data-date]').forEach(e=>{if(state.days[e.dataset.date])e.onclick=()=>openModal(e.dataset.date)})}function renderAll(){dash();calendarRender();planRender();logRender();researchRender();schoolsRender();settingsRender()}document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>switchView(t.dataset.view));quickLog.onclick=()=>openModal(nearest());todayBtn.onclick=()=>{cursor=new Date();switchView('calendar');calen
